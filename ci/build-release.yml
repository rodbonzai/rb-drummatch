name: Build & Release KitMatch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version to release (e.g. v1.0.0-beta.1)'
        required: false
        default: 'v1.0.0-beta.1'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Universal arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build KitMatch Release
        run: |
          cmake --build build --config Release --parallel

      - name: Package DMG Installer
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KitMatch-macOS-Universal
          path: |
            dist/*.dmg
            dist/*.sha256

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build KitMatch Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\KitMatch_artefacts\Release\KitMatch.exe, README.md -DestinationPath dist\KitMatch-v1.0.0-beta.1-Windows-x64.zip
          Get-FileHash -Algorithm SHA256 dist\KitMatch-v1.0.0-beta.1-Windows-x64.zip | Out-File -Encoding utf8 dist\KitMatch-v1.0.0-beta.1-Windows-x64.zip.sha256

      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows_installer.iss
          if (Test-Path dist\KitMatch-v1.0.0-beta.1-Windows-x64-Setup.exe) {
            Get-FileHash -Algorithm SHA256 dist\KitMatch-v1.0.0-beta.1-Windows-x64-Setup.exe | Out-File -Encoding utf8 dist\KitMatch-v1.0.0-beta.1-Windows-x64-Setup.exe.sha256
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KitMatch-Windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  publish-release:
    name: Publish Release to GitHub
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Consolidate distribution files
        run: |
          mkdir -p release_assets
          find all_artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.sha256" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: KitMatch ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: true
          files: release_assets/*
          body: |
            ## KitMatch - Smart Acoustic Drum Matching Workstation
            
            ### 📦 Descargas / Downloads:
            
            #### 🍎 macOS (Universal: Apple Silicon M1/M2/M3/M4 + Intel x86_64):
            - **`KitMatch-v1.0.0-beta.1-macOS-Universal.dmg`**: Instalador DMG oficial para macOS 11.0 o superior.
            
            #### 🪟 Windows (64-bit):
            - **`KitMatch-v1.0.0-beta.1-Windows-x64-Setup.exe`**: Instalador asistente para Windows 10/11.
            - **`KitMatch-v1.0.0-beta.1-Windows-x64.zip`**: Versión portable lista para descomprimir y ejecutar.
            
            ---
            *Verifica las sumas de verificación con los archivos `.sha256` correspondientes.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
